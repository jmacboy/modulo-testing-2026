# Configuración del broker de prueba. Ver docker-compose.yml.
#
# Por defecto RabbitMQ restringe el usuario `guest` a conexiones por loopback. Una conexión
# desde el host a través del puerto publicado del contenedor no llega como loopback, así que
# sin esto guest/guest puede ser rechazado.
#
# Es aceptable únicamente porque este broker es efímero, local y solo de prueba.
loopback_users = none
